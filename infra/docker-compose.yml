# Stack di produzione (VPS): Caddy (TLS) -> API (frontend + proxy) -> GraphHopper.
# Tutto il CODICE e' dentro le immagini (build da questo compose). Sul server
# serve solo la cartella ../data col dato: il grafo gia' importato
# (data/graph-cache) OPPURE il solo PBF arricchito (data/italy-fun.osm.pbf),
# nel qual caso il container GraphHopper lo importa da solo al primo avvio.
# Avvio unico:  docker compose up -d --build
services:
  graphhopper:
    build:
      context: ..
      dockerfile: infra/graphhopper.Dockerfile
    environment:
      - IMPORT_HEAP=9g # import Italia+LM (primo avvio senza graph-cache)
      - SERVE_HEAP=6g # server a regime
    volumes:
      - ../data:/app/data # grafo, PBF, elevation-cache: unico stato persistente
    restart: unless-stopped
    # nessuna porta pubblicata: raggiungibile solo dalla rete interna del compose

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      - GH_URL=http://graphhopper:8989
      - BM_DB=/app/data/bikemaps.db
    volumes:
      - ../data:/app/data # db dei giri salvati (bikemaps.db), condiviso col grafo
    depends_on:
      - graphhopper
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
